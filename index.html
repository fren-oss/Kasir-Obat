<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="description" content="Aplikasi kasir untuk apotek dan toko obat" />
    <meta name="theme-color" content="#3b82f6" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Kasir Obat" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="screen-orientation" content="any" />
    <meta name="x5-orientation" content="auto" />
    <meta name="full-screen" content="yes" />
    
    <title>Kasir Apotek</title>
    
    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json" />
    
    <!-- Icons -->
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <style>
      #loading {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: linear-gradient(135deg, #8dac16, #587aa5);
        color: white;
        font-family: system-ui, -apple-system, sans-serif;
        z-index: 9999;
      }
      #loading .spinner {
        width: 50px;
        height: 50px;
        border: 4px solid rgba(255,255,255,0.3);
        border-top-color: white;
        border-radius: 50%;
        animation: spin 1s linear infinite;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
    </style>
    <div id="loading">
      <div>
        <div class="spinner"></div>
        <p style="margin-top: 20px;">Memuat Kasir Obat...</p>
      </div>
    </div>
    <script>
      // Hide loading when app renders
      window.addEventListener('DOMContentLoaded', () => {
        setTimeout(() => {
          const loading = document.getElementById('loading');
          if (loading && document.querySelector('#root > *')) {
            loading.remove();
          }
        }, 1000);
      });
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
