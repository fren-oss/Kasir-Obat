<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="description" content="Aplikasi kasir untuk apotek dan toko obat" />
    <meta name="theme-color" content="#3b82f6" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Kasir Obat" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="screen-orientation" content="any" />
    <meta name="x5-orientation" content="auto" />
    <meta name="full-screen" content="yes" />
    
    <title>Kasir Apotek</title>
    
    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json" />
    
    <!-- Icons -->
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <style>
      #loading {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: linear-gradient(135deg, #8dac16, #587aa5);
        color: white;
        font-family: system-ui, -apple-system, sans-serif;
        z-index: 9999;
      }
      #loading .spinner {
        width: 50px;
        height: 50px;
        border: 4px solid rgba(255,255,255,0.3);
        border-top-color: white;
        border-radius: 50%;
        animation: spin 1s linear infinite;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
    </style>
    <div id="loading">
      <div>
        <div class="spinner"></div>
        <p style="margin-top: 20px;">Memuat Kasir Obat...</p>
      </div>
    </div>
    <script>
      // Hide loading when app renders
      let appRendered = false;
      
      // Function to check if React app is rendered
      function checkAppRendered() {
        const root = document.getElementById('root');
        const hasContent = root && root.children.length > 0;
        if (hasContent && !appRendered) {
          appRendered = true;
          const loading = document.getElementById('loading');
          if (loading) {
            loading.style.opacity = '0';
            loading.style.transition = 'opacity 0.3s';
            setTimeout(() => loading.remove(), 300);
          }
        }
      }
      
      // Check every 100ms for first 3 seconds
      window.addEventListener('DOMContentLoaded', () => {
        let checks = 0;
        const checkInterval = setInterval(() => {
          checkAppRendered();
          checks++;
          if (appRendered || checks > 30) { // Stop after 3 seconds
            clearInterval(checkInterval);
          }
        }, 100);
        
        // Safety: Show error after 15 seconds if still not rendered
        setTimeout(() => {
          if (!appRendered) {
            const loading = document.getElementById('loading');
            if (loading) {
              loading.innerHTML = `
                <div style="text-align: center; padding: 20px;">
                  <h2 style="color: white; margin-bottom: 20px;">⚠️ Gagal Memuat</h2>
                  <p style="color: white; margin-bottom: 10px;">Aplikasi gagal dimuat dalam 15 detik.</p>
                  <p style="color: rgba(255,255,255,0.8); font-size: 14px; margin-bottom: 30px;">
                    Kemungkinan: JavaScript error atau koneksi lambat
                  </p>
                  <button 
                    onclick="location.reload()" 
                    style="padding: 12px 32px; font-size: 16px; background: white; border: none; border-radius: 8px; cursor: pointer; font-weight: 600; margin-bottom: 20px;">
                    Muat Ulang
                  </button>
                  <div style="margin-top: 20px;">
                    <button 
                      onclick="window.open('https://kasir-obat.vercel.app', '_blank')" 
                      style="padding: 8px 20px; font-size: 14px; background: rgba(255,255,255,0.2); color: white; border: 1px solid white; border-radius: 6px; cursor: pointer;">
                      Buka di Tab Baru
                    </button>
                  </div>
                  <p style="color: rgba(255,255,255,0.7); font-size: 12px; margin-top: 20px;">
                    Jika masih error, buka Console (F12) untuk lihat detail error
                  </p>
                </div>
              `;
            }
          }
        }, 15000);
      });
      
      // Expose function globally so React can call it
      window.appReady = function() {
        appRendered = true;
        checkAppRendered();
      };
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
